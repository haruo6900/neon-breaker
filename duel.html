<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060913">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEON DUEL">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="離れた端末とオンライン対戦できるネオン風ピンポンゲーム。iPhoneは縦持ちのまま、画面下のパッドで操作できます。ルームコードを共有するだけで遊べます。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>NEON DUEL — オンライン2人対戦</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  :root {
    --cyan: #4ecdc4;
    --pink: #ff4d6d;
    --violet: #7b61ff;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding:
      max(12px, env(safe-area-inset-top))
      max(12px, env(safe-area-inset-right))
      max(12px, env(safe-area-inset-bottom))
      max(12px, env(safe-area-inset-left));
    background: #060913;
    background-image:
      radial-gradient(1000px 560px at 8% -10%, rgba(78, 205, 196, 0.20), transparent 68%),
      radial-gradient(900px 540px at 96% 4%, rgba(255, 77, 109, 0.16), transparent 68%),
      radial-gradient(800px 500px at 50% 118%, rgba(123, 97, 255, 0.16), transparent 70%);
    color: #e8ecff;
    font-family: ui-sans-serif, system-ui, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  .wrap {
    width: min(1080px, 100%, calc((100vh - 156px) * 1.6));
    width: min(1080px, 100%, calc((100dvh - 156px) * 1.6));
    margin: 0 auto;
  }

  /* ---------- ヘッダー ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
    padding: 0 4px;
  }

  .brand {
    font-size: clamp(14px, 2vw, 19px);
    font-weight: 900;
    letter-spacing: 0.18em;
    line-height: 1;
    white-space: nowrap;
  }

  .brand span {
    background: linear-gradient(90deg, var(--cyan), var(--violet) 55%, var(--pink));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .scoreboard {
    display: flex;
    align-items: center;
    gap: clamp(8px, 1.8vw, 18px);
  }

  .score-side { display: flex; align-items: center; gap: 9px; }

  .tag {
    font-size: 8.5px;
    font-weight: 800;
    letter-spacing: 0.18em;
    padding: 4px 6px 3px;
    border-radius: 5px;
    border: 1px solid rgba(150, 170, 255, 0.18);
    background: rgba(150, 170, 255, 0.06);
    color: #9aa5cc;
  }

  .p1 .tag { color: var(--cyan); border-color: rgba(78, 205, 196, 0.35); background: rgba(78, 205, 196, 0.08); }
  .p2 .tag { color: var(--pink); border-color: rgba(255, 77, 109, 0.35); background: rgba(255, 77, 109, 0.08); }

  .num {
    display: inline-block;
    min-width: 1.1ch;
    text-align: center;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: clamp(22px, 3.4vw, 32px);
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    transform-origin: center;
  }

  .p1 .num { color: var(--cyan); text-shadow: 0 0 20px rgba(78, 205, 196, 0.55); }
  .p2 .num { color: var(--pink); text-shadow: 0 0 20px rgba(255, 77, 109, 0.55); }

  .num.pop { animation: pop 0.36s cubic-bezier(0.3, 1.6, 0.5, 1); }

  @keyframes pop {
    0% { transform: scale(1); }
    35% { transform: scale(1.42); }
    100% { transform: scale(1); }
  }

  .vs {
    color: #4d587f;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 13px;
    font-weight: 700;
  }

  .tools { display: flex; align-items: center; gap: 7px; }

  .target {
    margin-right: 3px;
    color: #5f6a95;
    font-size: 8.5px;
    font-weight: 800;
    letter-spacing: 0.15em;
    white-space: nowrap;
  }

  .icon-btn {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border-radius: 9px;
    border: 1px solid rgba(150, 170, 255, 0.16);
    background: rgba(150, 170, 255, 0.06);
    color: #aab3d6;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, transform 0.15s;
  }

  .icon-btn:hover { background: rgba(150, 170, 255, 0.14); color: #fff; }
  .icon-btn:active { transform: scale(0.94); }

  /* ---------- ゲーム画面 ---------- */
  .stage {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    background: #080d1c;
    touch-action: none;
    box-shadow:
      0 30px 80px -22px rgba(0, 0, 0, 0.95),
      0 0 0 1px rgba(120, 150, 255, 0.17),
      0 0 80px -42px rgba(78, 205, 196, 0.85);
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 8 / 5;
    touch-action: none;
    cursor: default;
  }

  /* 縦持ち用の操作パッド。横持ち・PCでは非表示 */
  .touchpad { display: none; }

  /* ---------- オーバーレイ ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 9px;
    padding: 22px;
    text-align: center;
    background: rgba(5, 8, 18, 0.76);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    touch-action: pan-y;
    transition: opacity 0.25s ease;
  }

  .overlay.show { opacity: 1; visibility: visible; pointer-events: auto; }

  .overlay h2 {
    margin: 0;
    font-size: clamp(28px, 6vw, 52px);
    font-weight: 900;
    letter-spacing: 0.1em;
    line-height: 1.1;
    background: linear-gradient(90deg, var(--cyan), #ffffff 48%, var(--pink));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 24px rgba(123, 97, 255, 0.55));
  }

  .overlay p {
    margin: 0;
    max-width: 30em;
    color: #aab3d6;
    font-size: clamp(12px, 1.8vw, 15px);
    line-height: 1.9;
  }

  .overlay p b { color: #fff; font-weight: 800; }

  .iphone-line { display: none; }

  .overlay .note {
    margin-top: 1px;
    color: #5e6994;
    font-size: 10.5px;
    letter-spacing: 0.1em;
  }

  .ov-actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-top: 7px;
  }

  #ov-btn {
    padding: 13px 42px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    background: linear-gradient(120deg, var(--cyan), var(--violet) 55%, var(--pink));
    color: #070b16;
    font-family: inherit;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 0.08em;
    cursor: pointer;
    box-shadow: 0 14px 38px -12px rgba(123, 97, 255, 0.95);
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }

  #ov-btn:hover { transform: translateY(-2px); box-shadow: 0 20px 46px -14px rgba(123, 97, 255, 1); }
  #ov-btn:active { transform: translateY(0) scale(0.98); }
  #ov-btn:disabled { opacity: 0.45; cursor: default; transform: none; box-shadow: none; }

  #ov-btn2 {
    padding: 9px 28px;
    border-radius: 999px;
    border: 1px solid rgba(150, 170, 255, 0.24);
    background: rgba(150, 170, 255, 0.07);
    color: #c2cbeb;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }

  #ov-btn2:hover { background: rgba(150, 170, 255, 0.16); color: #fff; }

  /* ---------- オンラインロビー ---------- */
  .overlay.lobby { z-index: 2; padding: 14px; }

  .lobby-box {
    width: min(460px, 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .lobby-box h2 { font-size: clamp(24px, 4.6vw, 42px); }

  .lobby-lead {
    font-size: clamp(11px, 1.7vw, 13.5px) !important;
    color: #8b96bd !important;
    line-height: 1.7 !important;
  }

  .lb-panel {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-top: 3px;
  }

  .wide-btn {
    width: min(300px, 100%);
    padding: 12px 28px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    background: linear-gradient(120deg, var(--cyan), var(--violet) 60%, var(--pink));
    color: #070b16;
    font-family: inherit;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 0.07em;
    cursor: pointer;
    box-shadow: 0 12px 32px -12px rgba(123, 97, 255, 0.9);
    transition: transform 0.15s, filter 0.15s;
  }

  .wide-btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
  .wide-btn:active { transform: scale(0.98); }

  .join-row {
    display: flex;
    gap: 8px;
    width: min(300px, 100%);
  }

  #join-code {
    flex: 1;
    min-width: 0;
    padding: 11px 10px;
    border-radius: 10px;
    border: 1px solid rgba(150, 170, 255, 0.22);
    background: rgba(150, 170, 255, 0.06);
    color: #fff;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-align: center;
    text-transform: uppercase;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  #join-code::placeholder {
    color: #4f5a80;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
  }

  #join-code:focus {
    border-color: rgba(78, 205, 196, 0.6);
    box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.12);
  }

  .small-btn {
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid rgba(78, 205, 196, 0.3);
    background: rgba(78, 205, 196, 0.1);
    color: #bff8f3;
    font-family: inherit;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.04em;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s, opacity 0.2s;
  }

  .small-btn:hover { background: rgba(78, 205, 196, 0.18); }
  .small-btn:disabled { opacity: 0.35; cursor: default; }

  .code-cap {
    margin: 0;
    color: #5f6a95;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.24em;
  }

  .room-code {
    padding: 2px 6px 2px 14px;
    color: #fff;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: clamp(30px, 5.2vw, 44px);
    font-weight: 800;
    letter-spacing: 0.22em;
    line-height: 1.15;
    text-shadow: 0 0 26px rgba(78, 205, 196, 0.7);
    -webkit-user-select: text;
    user-select: text;
  }

  .status-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    min-height: 18px;
    color: #9aa5cc;
    font-size: 11.5px;
  }

  .spinner {
    width: 13px;
    height: 13px;
    flex: none;
    border-radius: 50%;
    border: 2px solid rgba(120, 150, 255, 0.2);
    border-top-color: var(--cyan);
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .lb-error {
    margin: 0;
    min-height: 1.1em;
    max-width: 320px;
    color: #ff9aae;
    font-size: 11.5px;
    line-height: 1.5;
  }

  .link-btn {
    padding: 2px 6px;
    border: 0;
    background: none;
    color: #7d88b3;
    font-family: inherit;
    font-size: 11.5px;
    cursor: pointer;
  }

  .link-btn:hover { color: #fff; }

  .join-code-view {
    margin: 0;
    color: #8b96bd;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.2em;
  }

  /* ---------- フッター ---------- */
  .hint {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 7px 16px;
    margin-top: 11px;
    padding: 0 4px;
    color: #66719a;
    font-size: 11px;
  }

  .hint .p1hint b { color: var(--cyan); }
  .hint .p2hint b { color: var(--pink); }

  kbd {
    display: inline-block;
    padding: 1px 6px;
    margin: 0 1px;
    border-radius: 5px;
    border: 1px solid rgba(150, 170, 255, 0.22);
    border-bottom-width: 2px;
    background: rgba(150, 170, 255, 0.08);
    color: #b9c3e6;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 10.5px;
  }

  @media (max-width: 680px) {
    .brand { font-size: 13px; letter-spacing: 0.08em; }
    .tag { display: none; }
    .target { display: none; }
    .scoreboard { gap: 6px; }
    .num { font-size: 26px; }
    .icon-btn { width: 44px; height: 44px; border-radius: 12px; font-size: 15px; }
    .tools { gap: 5px; }
    .stage { border-radius: 13px; }
    .hint { gap: 6px 11px; font-size: 10px; }
    .overlay { padding: 12px; gap: 6px; }
    .overlay h2 { font-size: clamp(22px, 6vw, 40px); }
    .overlay p { font-size: 11px; line-height: 1.6; }
    .overlay .note { display: none; }
    #ov-btn { min-height: 46px; padding: 12px 30px; font-size: 14px; }
    #ov-btn2 { min-height: 40px; padding: 9px 20px; font-size: 12px; }
    .lobby-box h2 { font-size: clamp(20px, 5.6vw, 32px); }
    .lobby-lead { display: none; }
    .wide-btn { min-height: 48px; padding: 12px 24px; font-size: 14px; }
    .small-btn { min-height: 46px; font-size: 13px; }
    .lb-panel { gap: 8px; margin-top: 0; }
    .room-code { font-size: 32px; }
    #join-code { min-height: 46px; }
    .link-btn { padding: 8px 10px; font-size: 12px; }
  }

  /* iPhone などの縦向き: ロビーが窮屈にならないよう画面全体を使う */
  @media (max-width: 680px) and (orientation: portrait) {
    html, body { height: 100%; overflow: hidden; }
    body {
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      display: flex;
      align-items: stretch;
      padding:
        max(8px, env(safe-area-inset-top))
        max(10px, env(safe-area-inset-right))
        max(8px, env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));
      overscroll-behavior: none;
    }
    .wrap {
      width: 100%;
      max-width: none;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    header { flex: none; margin-bottom: 8px; }
    .stage {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      border-radius: 16px;
    }
    canvas {
      flex: 0 0 auto;
      width: 100%;
      height: auto;
      max-height: none;
      aspect-ratio: 8 / 5;
    }

    /* 縦持ちではゲーム画面の下に大きな縦スライド操作パッドを置く */
    .touchpad {
      position: relative;
      display: block;
      flex: 1 1 auto;
      min-height: 0;
      margin-top: 8px;
      border-radius: 14px;
      border: 1px solid rgba(120, 150, 255, 0.18);
      background:
        radial-gradient(ellipse at 50% 0%, rgba(78, 205, 196, 0.08), transparent 55%),
        radial-gradient(ellipse at 50% 100%, rgba(255, 77, 109, 0.07), transparent 55%),
        linear-gradient(180deg, rgba(10, 16, 34, 0.9), rgba(6, 10, 20, 0.96));
      overflow: hidden;
      pointer-events: none;
    }
    .touchpad-rail {
      position: absolute;
      left: 50%;
      top: 14px;
      bottom: 14px;
      width: 2px;
      margin-left: -1px;
      background: linear-gradient(180deg, rgba(78, 205, 196, 0.45), rgba(150, 170, 255, 0.08) 50%, rgba(255, 77, 109, 0.45));
      opacity: 0.6;
    }
    .touchpad-knob {
      position: absolute;
      left: 25%;
      top: 50%;
      width: 52px;
      height: 52px;
      margin-left: -26px;
      margin-top: -26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: #07101b;
      background: radial-gradient(circle at 35% 30%, #ffffff, #7cf5e9 45%, #25b9b1);
      box-shadow: 0 0 18px rgba(78, 205, 196, 0.55), 0 8px 20px rgba(0, 0, 0, 0.4);
      will-change: top;
    }
    .touchpad-knob.p2 {
      left: 75%;
      background: radial-gradient(circle at 35% 30%, #ffffff, #ff9fb2 45%, #e3355b);
      box-shadow: 0 0 18px rgba(255, 77, 109, 0.55), 0 8px 20px rgba(0, 0, 0, 0.4);
    }
    .touchpad-knob span { transform: translateY(1px); }
    .touchpad-caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 8px;
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: rgba(170, 190, 235, 0.72);
    }

    .overlay { border-radius: 16px; overflow-y: auto; }
    .lobby-lead { display: block; max-width: 24em; font-size: 11px !important; line-height: 1.55 !important; }
    .hint { display: none; }
  }

  /* iPhone 横向き: ヘッダー以外をゲーム画面に使い、黒帯を許容して最大化 */
  @media (orientation: landscape) and (max-height: 520px) {
    html, body { height: 100%; overflow: hidden; }
    body {
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      display: block;
      padding: 0;
      overscroll-behavior: none;
    }
    .wrap {
      width: 100%;
      max-width: none;
      height: 100%;
      display: flex;
      flex-direction: column;
      margin: 0;
      /* ホームインジケーターとゲーム画面の下端が重ならないようにする */
      padding-bottom: env(safe-area-inset-bottom);
    }
    header {
      flex: none;
      margin: 0;
      padding:
        max(4px, env(safe-area-inset-top))
        max(10px, env(safe-area-inset-right))
        4px
        max(10px, env(safe-area-inset-left));
      gap: 8px;
    }
    .brand { font-size: 12px; letter-spacing: 0.1em; }
    .scoreboard { gap: 8px; }
    .num { font-size: 26px; }
    .icon-btn { width: 44px; height: 44px; border-radius: 12px; font-size: 15px; }
    .tools { gap: 6px; }
    .stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0;
      box-shadow: none;
    }
    canvas {
      width: auto;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 8 / 5;
    }
    .hint { display: none; }
    .overlay {
      padding:
        6px
        max(14px, env(safe-area-inset-right))
        6px
        max(14px, env(safe-area-inset-left));
      gap: 5px;
      overflow-y: auto;
    }
    .overlay h2 { font-size: clamp(22px, 6.2vh, 34px); }
    .overlay p { font-size: 11px; line-height: 1.55; }
    .overlay .note { display: none; }
    .ov-actions { gap: 5px; margin-top: 3px; }
    #ov-btn { min-height: 44px; padding: 10px 30px; font-size: 13px; }
    #ov-btn2 { min-height: 40px; padding: 8px 20px; font-size: 11px; }
    .lobby-box h2 { font-size: clamp(20px, 5vh, 30px); }
    .lobby-lead { display: none; }
    .lb-panel { gap: 6px; }
    .wide-btn { min-height: 44px; padding: 10px 22px; font-size: 13px; }
    #join-code { min-height: 44px; }
    .small-btn { min-height: 44px; }
    .link-btn { min-height: 40px; }
    .room-code { font-size: 30px; }
    .status-line { min-height: 16px; }
    .lb-error { font-size: 10.5px; }
  }

  @media (pointer: coarse) {
    .iphone-line { display: inline; }
    .icon-btn, .wide-btn, .small-btn, #ov-btn, #ov-btn2, .link-btn, #join-code {
      touch-action: manipulation;
    }
    .icon-btn:active, .wide-btn:active, .small-btn:active, #ov-btn:active, #ov-btn2:active {
      transform: scale(0.96);
    }
  }

  @media (hover: none) {
    .hint .keyhint { display: none; }
    .hint kbd { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; }
    .spinner { animation-duration: 1.4s; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">NEON <span>DUEL</span></div>
    <div class="scoreboard" aria-label="スコア">
      <div class="score-side p1"><span class="tag">P1</span><span class="num" id="score1">0</span></div>
      <span class="vs">/</span>
      <div class="score-side p2"><span class="num" id="score2">0</span><span class="tag">P2</span></div>
    </div>
    <div class="tools">
      <span class="target" id="mode-label">FIRST TO 7</span>
      <button class="icon-btn" id="pause" type="button" aria-label="一時停止" title="一時停止 (P)">❚❚</button>
      <button class="icon-btn" id="fs" type="button" aria-label="全画面表示" title="全画面">⛶</button>
      <button class="icon-btn" id="sound" type="button" aria-label="サウンドの切り替え" title="サウンド (M)">🔊</button>
    </div>
  </header>

  <div class="stage">
    <canvas id="game" width="960" height="600" aria-label="2人対戦ピンポンゲーム画面"></canvas>

    <div class="touchpad" id="touchpad" aria-hidden="true">
      <div class="touchpad-rail"></div>
      <div class="touchpad-knob p1" id="pad-p1"><span>P1</span></div>
      <div class="touchpad-knob p2" id="pad-p2"><span>P2</span></div>
      <div class="touchpad-caption">上下にドラッグ</div>
    </div>

    <div class="overlay" id="overlay">
      <h2 id="ov-title">NEON DUEL</h2>
      <p id="ov-msg"></p>
      <div class="ov-actions">
        <button id="ov-btn" type="button">オンライン対戦</button>
        <button id="ov-btn2" type="button">1台で対戦</button>
      </div>
      <span class="note" id="ov-note"></span>
    </div>

    <div class="overlay lobby" id="lobby">
      <div class="lobby-box">
        <h2>ONLINE MATCH</h2>
        <p class="lobby-lead">ルームを作るか、相手のコードで参加してください。</p>

        <div class="lb-panel" id="lb-menu">
          <button class="wide-btn" id="btn-host" type="button">ルームを作る</button>
          <div class="join-row">
            <input id="join-code" type="text" maxlength="5" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="コード 5文字" aria-label="ルームコード">
            <button class="small-btn" id="btn-join" type="button">参加</button>
          </div>
          <p class="lb-error" id="lb-error" role="alert"></p>
          <button class="link-btn" id="btn-lobby-back" type="button">← タイトルに戻る</button>

    <span id="hint-touch">タッチ: 上下にドラッグ</span>
