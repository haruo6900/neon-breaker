  <line x1="256" y1="70" x2="256" y2="442" stroke="#7b61ff" stroke-width="9" stroke-dasharray="16 24" opacity="0.55"/>
  <rect x="92" y="158" width="58" height="196" rx="29" fill="url(#cyan)" filter="url(#glow)"/>
  <rect x="362" y="158" width="58" height="196" rx="29" fill="url(#pink)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="29" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="11" fill="#dffcff"/>
