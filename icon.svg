<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NEON DUEL">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#1a2140"/>
      <stop offset="100%" stop-color="#060913"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bff8f3"/>
      <stop offset="100%" stop-color="#4ecdc4"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb3c1"/>
      <stop offset="100%" stop-color="#ff4d6d"/>
